[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-robot-interaction"
version = "0.1.0"
description = "Local MELD text and audio perception with a streaming robot interaction demo"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "pandas>=2,<3", "joblib>=1.3,<2", "fastapi>=0.100,<1", "uvicorn[standard]>=0.23,<1", "psutil>=5.9,<8", "pydantic>=2,<3", "threadpoolctl>=3,<4"]

[tool.setuptools.packages.find]
include = ["robot_interaction*"]
